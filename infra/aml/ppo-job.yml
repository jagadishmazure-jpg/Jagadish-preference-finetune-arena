# TRL PPO on Phi-3.5-mini, reward = the repo's Bradley-Terry model. WRITTEN, NOT RUN.
# Uses environment-ppo.yml (TRL 1.11.0). See scripts/ppo_trl.py.
#   az ml job create -f infra/aml/ppo-job.yml -g rg-prefarena-dev -w mlw-prefarena-dev
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: ppo-phi35-bradley-terry
experiment_name: preference-arena-ppo
compute: azureml:gpu-a100
tags:
  method: ppo
  reward: bradley-terry-bow
  gpu_sku_a100: Standard_NC24ads_A100_v4
  gpu_sku_h100: Standard_NC40ads_H100_v5
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: environment-ppo.yml
code: ../..
command: >-
  python scripts/ppo_trl.py
  --model microsoft/Phi-3.5-mini-instruct
  --output ${{outputs.policy}}
outputs:
  policy:
    type: uri_folder
limits:
  timeout: 14400
resources:
  instance_count: 1

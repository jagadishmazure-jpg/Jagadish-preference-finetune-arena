# Managed online endpoint for the QLoRA adapter. WRITTEN, NOT RUN.
# Online endpoints do not scale to zero: instance_count on the deployment is at least 1,
# so do not create this until someone has accepted the hourly GPU charge.
#   az ml online-endpoint create -f infra/aml/qlora-endpoint.yml -g rg-prefarena-dev -w mlw-prefarena-dev
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineEndpoint.schema.json
name: prefarena-qlora
auth_mode: aad_token
# Top-level network setting. Entra (aad_token) is the access control that this file actually
# configures. Private networking is not built (docs/deployment.md), so the endpoint stays
# reachable by an authenticated caller. Keep this key at the top level. Nested under a
# properties map, Azure ML stores it as a tag and leaves the default network policy in place.
public_network_access: enabled
description: Phi-3.5-mini QLoRA adapter. Entra auth only. Not created by CI.
tags:
  method: qlora

# Deployment of the registered adapter. WRITTEN, NOT RUN.
# 4-bit Phi-3.5 inference fits a 16 GB GPU. The training job is the A100/H100; this deployment
# uses a T4 so a serving test does not bill an A100 per hour. Switch instance_type to
# Standard_NC24ads_A100_v4 if the T4 runs out of memory.
#   az ml online-deployment create -f infra/aml/qlora-deployment.yml -g rg-prefarena-dev -w mlw-prefarena-dev
$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: qlora
endpoint_name: prefarena-qlora
model: azureml:phi35-qlora-adapter@latest
instance_type: Standard_NC4as_T4_v3
instance_count: 1
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: environment-gpu.yml
code_configuration:
  code: ../..
  scoring_script: scripts/score_qlora.py
environment_variables:
  BASE_MODEL: microsoft/Phi-3.5-mini-instruct
request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 1
liveness_probe:
  initial_delay: 600
  period: 30
  timeout: 10
  success_threshold: 1
  failure_threshold: 30
readiness_probe:
  initial_delay: 600
  period: 30
  timeout: 10
  success_threshold: 1
  failure_threshold: 30

# Train the mini-GPT on a GPU cluster and keep the checkpoint. WRITTEN, NOT RUN.
# CPU smoke (what CI runs): python scripts/foundations_smoke.py
# Submit only after the same review gate as the other Azure ML jobs:
#   az ml job create -f llm-foundations/azure/minigpt-job.yml -g rg-prefarena-dev -w mlw-prefarena-dev
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: minigpt-fenwold-corpus
experiment_name: llm-foundations
compute: azureml:gpu-a100
tags:
  method: minigpt
  gpu_sku_a100: Standard_NC24ads_A100_v4
  gpu_sku_h100: Standard_NC40ads_H100_v5
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../../infra/aml/environment-gpu.yml
code: ../..
command: >-
  python llm-foundations/run_gpu.py --output ${{outputs.model}} --steps 400
outputs:
  model:
    type: uri_folder
limits:
  timeout: 3600
resources:
  instance_count: 1

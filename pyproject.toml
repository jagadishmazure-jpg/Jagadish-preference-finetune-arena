[project]
name = "preference-finetune-arena"
version = "0.1.0"
description = "Preference data, reward models and DPO/ORPO LoRA tuning of a tiny open model on CPU, with bias-aware evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.5.4", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]
train = ["torch==2.15.0+cpu", "transformers==5.22.2"]
measure = ["llama-cpp-python==0.3.36", "sentence-transformers==6.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prefarena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
